# Docker 环境配置文件
# ==================== 服务器配置 ====================
server.port=8080
server.servlet.context-path=/
server.tomcat.max-swallow-size=-1
server.connection-timeout=-1
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# ==================== Spring 配置 ====================
spring.application.name=quick-box-server
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=/tmp

# ==================== Redis 配置 ====================
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=10000ms
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=-1ms

# ==================== 文件存储配置 ====================
file.storage.base-path=${FILE_STORAGE_BASE_PATH:/data/storage}
file.storage.chunk-path=${file.storage.base-path}/chunks
file.storage.file-path=${file.storage.base-path}/files
file.storage.create-directories=true
file.storage.max-file-size=100MB
file.storage.max-folder-size=10GB
file.storage.max-folder-files=1000
file.storage.cleanup.enabled=true
file.storage.cleanup.cron=0 0 3 * * *
file.storage.cleanup.expire-days=7

# ==================== 存储策略配置 ====================
storage.strategy.type=${STORAGE_STRATEGY_TYPE:PRIMARY_BACKUP}
storage.primary.backend=${STORAGE_PRIMARY_BACKEND:local}
storage.backup.backends=${STORAGE_BACKUP_BACKENDS:}
storage.load-balance.algorithm=ROUND_ROBIN
storage.health-check.enabled=true
storage.health-check.interval=30000
storage.auto-failover.enabled=true
storage.auto-failover.threshold=3

# ==================== 本地存储配置 ====================
storage.local.default.name=default-local
storage.local.default.enabled=true
storage.local.default.primary=true
storage.local.default.priority=1
storage.local.default.base-path=${file.storage.base-path}
storage.local.default.chunk-path=${file.storage.chunk-path}
storage.local.default.file-path=${file.storage.file-path}
storage.local.default.create-directories=true
storage.local.default.use-temp-files=true
storage.local.default.temp-file-prefix=quickbox_

# ==================== S3/MinIO 存储配置 ====================
storage.s3.default.name=default-s3
storage.s3.default.enabled=${S3_ENABLED:false}
storage.s3.default.primary=false
storage.s3.default.priority=10
storage.s3.default.endpoint=${S3_ENDPOINT:http://minio:9000}
storage.s3.default.region=${S3_REGION:us-east-1}
storage.s3.default.access-key=${S3_ACCESS_KEY:}
storage.s3.default.secret-key=${S3_SECRET_KEY:}
storage.s3.default.bucket-name=${S3_BUCKET_NAME:quickbox-files}
storage.s3.default.path-style-access=true
storage.s3.default.use-ssl=false
storage.s3.default.prefix=uploads
storage.s3.default.part-size=5242880

# ==================== 监控配置 ====================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ==================== 日志配置 ====================
logging.file.name=/data/logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.level.com.jiaruiblog.quickboxserver=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==================== 安全配置 ====================
security.basic.enabled=false
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ==================== 性能优化 ====================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# ==================== 缓存配置 ====================
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=quickbox:

# ==================== 上传限制 ====================
upload.max-concurrent-sessions=100
upload.max-chunk-size=5242880
upload.max-retry-attempts=3
upload.retry-delay=1000
upload.session-timeout=86400
upload.cleanup-interval=3600

# ==================== 文件夹上传配置 ====================
folder.upload.enabled=true
folder.upload.max-depth=10
folder.upload.max-total-size=10737418240
folder.upload.max-files=1000
folder.upload.auto-zip=true
folder.upload.keep-structure=true
folder.upload.zip-compression-level=5
folder.upload.zip-buffer-size=8192