# 生产环境配置
server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    max-swallow-size: -1
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    max-connections: 10000

spring:
  application:
    name: quick-box-server
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
      file-size-threshold: 2KB
      location: /tmp
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      key-prefix: "quickbox:"

redis:
  host: ${REDIS_HOST:redis}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: 0
  timeout: 10000
  pool:
    max-active: 20
    max-wait: -1ms
    max-idle: 10
    min-idle: 5

file:
  storage:
    base-path: ${FILE_STORAGE_BASE_PATH:/data/storage}
    chunks-path: ${file.storage.base-path}/chunks
    final-path: ${file.storage.base-path}/files
    create-directories: true
    max-file-size: 100MB
    max-folder-size: 10GB
    max-folder-files: 1000
    cleanup:
      enabled: true
      cron: "0 0 3 * * *"
      expire-days: 7

storage:
  strategy:
    type: ${STORAGE_STRATEGY_TYPE:PRIMARY_BACKUP}
  primary:
    backend: ${STORAGE_PRIMARY_BACKEND:local}
  backup:
    backends: ${STORAGE_BACKUP_BACKENDS:}
  load-balance:
    algorithm: ROUND_ROBIN
  health-check:
    enabled: true
    interval: 30000
  auto-failover:
    enabled: true
    threshold: 3
  local:
    default:
      name: default-local
      enabled: true
      primary: true
      priority: 1
      base-path: ${file.storage.base-path}
      chunk-path: ${file.storage.chunks-path}
      file-path: ${file.storage.final-path}
      create-directories: true
      use-temp-files: true
      temp-file-prefix: quickbox_
  s3:
    default:
      name: default-s3
      enabled: ${S3_ENABLED:false}
      primary: false
      priority: 10
      endpoint: ${S3_ENDPOINT:http://minio:9000}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      bucket-name: ${S3_BUCKET_NAME:quickbox-files}
      path-style-access: true
      use-ssl: false
      prefix: uploads
      part-size: 5242880

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

logging:
  file:
    name: /data/logs/application.log
    max-size: 10MB
    max-history: 30
  level:
    com.jiaruiblog.quickboxserver: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

security:
  basic:
    enabled: false

cors:
  allowed-origins: "*"
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

upload:
  max-concurrent-sessions: 100
  max-chunk-size: 5242880
  max-retry-attempts: 3
  retry-delay: 1000
  session-timeout: 86400
  cleanup-interval: 3600

folder:
  upload:
    enabled: true
    max-depth: 10
    max-total-size: 10737418240
    max-files: 1000
    auto-zip: true
    keep-structure: true
    zip-compression-level: 5
    zip-buffer-size: 8192