version: '3.8'

services:
  # QuickBox 应用服务
  quickbox:
    build: .
    container_name: quickbox-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - FILE_STORAGE_BASE_PATH=/data/storage
      - STORAGE_STRATEGY_TYPE=PRIMARY_BACKUP
      - STORAGE_PRIMARY_BACKEND=local
      - WAIT_FOR_HOSTS=redis:6379
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    volumes:
      - quickbox_data:/data/storage
      - quickbox_logs:/data/logs
    depends_on:
      - redis
    networks:
      - quickbox-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: quickbox-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - quickbox-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO 对象存储（可选）
  minio:
    image: minio/minio:latest
    container_name: quickbox-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password123}
      - MINIO_DEFAULT_BUCKETS=quickbox-files,quickbox-backups
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - quickbox-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 前端应用服务
  frontend:
    build: ./docker/frontend
    container_name: quickbox-frontend
    restart: unless-stopped
    volumes:
      - frontend_build:/app/build
    networks:
      - quickbox-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: quickbox-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ssl:/etc/nginx/ssl:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      - quickbox
      - frontend
    networks:
      - quickbox-network

  # 监控服务（可选）
  prometheus:
    image: prom/prometheus:latest
    container_name: quickbox-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - quickbox-network

  # Grafana 仪表板（可选）
  grafana:
    image: grafana/grafana:latest
    container_name: quickbox-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - quickbox-network

# 数据卷定义
volumes:
  quickbox_data:
    driver: local
  quickbox_logs:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  frontend_build:
    driver: local

# 网络定义
networks:
  quickbox-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16